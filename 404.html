<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Page not found</title>
  <meta name="color-scheme" content="light dark">
  <!-- Root-absolute paths: GitHub Pages serves this file at whatever URL was missing. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/recursive.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/main.css">
  <script src="/assets/js/theme.js"></script>
  <script src="/assets/js/404.js" defer></script>
</head>
<body>
  <main class="section notfound">
    <p class="notfound__code mono">404</p>
    <h1 class="section__title">This page doesn't exist</h1>
    <p class="section__intro">The link may have a typo, or the page has moved. You asked for <code data-path>this page</code>.</p>
    <p class="cta"><a class="btn btn--solid" href="/">Go to the home page</a></p>
  </main>
</body>
</html>
